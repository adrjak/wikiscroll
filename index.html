<title>WikiScroll: Wikipedia meets TikTok</title>
<style>
/* Layout: one full-height snap feed; each card is a mobile encyclopedia page: title, picture with caption, lead paragraph, one infobox row, action bar. */
:root{
  --bg:#ffffff;
  --text:#202122;
  --muted:#54595d;
  --faint:#72777d;
  --rule:#a2a9b1;
  --rule-soft:#eaecf0;
  --box:#f8f9fa;
  --link:#3366cc;
  --heart:#d73333;
  --scrim:rgba(32,33,34,.45);
  --serif:"Linux Libertine","Georgia","Times",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Lato,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101418;--text:#eaecf0;--muted:#a2a9b1;--faint:#8a9097;--rule:#54595d;--rule-soft:#27292d;--box:#1a1d21;--link:#88a3e8;--heart:#fd7865;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101418;--text:#eaecf0;--muted:#a2a9b1;--faint:#8a9097;--rule:#54595d;--rule-soft:#27292d;--box:#1a1d21;--link:#88a3e8;--heart:#fd7865;--scrim:rgba(0,0,0,.6);color-scheme:dark}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:2px}

#app{position:relative;height:100%;overflow:hidden;max-width:520px;margin:0 auto;border-left:1px solid var(--rule-soft);border-right:1px solid var(--rule-soft)}

/* header */
.top{position:absolute;inset:0 0 auto;z-index:20;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-bottom:1px solid var(--rule-soft);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(10px, env(safe-area-inset-right, 0px))}
.brand{font-family:var(--serif);font-size:21px;letter-spacing:.01em;display:flex;align-items:baseline;gap:3px}
.brand sup{font-family:var(--sans);font-size:10px;color:var(--link)}
.tabs{display:flex;gap:16px;font-size:14px;position:absolute;left:50%;transform:translateX(-50%)}
.tabs span{padding:15px 0 13px;border-bottom:2px solid transparent}
.tabs .on{color:var(--text);font-weight:600;border-bottom-color:var(--link)}
.tabs .off{color:var(--faint)}
.tools{display:flex;align-items:center;gap:4px}
.langpick{position:relative}
.langbtn{display:flex;align-items:center;gap:5px;height:34px;padding:0 8px;border:1px solid var(--rule);border-radius:2px;font-size:13px;font-weight:600;color:var(--text);background:var(--bg)}
.langbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.langbtn .chev{width:14px;height:14px;color:var(--muted)}
.langmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:180px;background:var(--bg);border:1px solid var(--rule);box-shadow:0 6px 18px rgba(0,0,0,.12);display:flex;flex-direction:column;padding:4px 0}
.langmenu button{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 14px;font-size:15px;text-align:left;color:var(--text)}
.langmenu button small{font-size:11px;font-weight:600;color:var(--faint)}
.langmenu button:hover{background:var(--box)}
.langmenu button[aria-checked="true"]{color:var(--link);font-weight:600}
.langmenu button[aria-checked="true"] small{color:var(--link)}
.sound .off{display:none}.sound.muted .on{display:none}.sound.muted .off{display:block}.sound.muted{color:var(--faint)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border:1px solid var(--rule);background:var(--box);font-size:14px;border-radius:2px;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--link);border-color:var(--link);color:#fff;font-weight:600}
.iconbtn{width:40px;height:40px;border-radius:4px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--box)}
.iconbtn svg{width:20px;height:20px}

/* feed */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--rule-soft);user-select:none;-webkit-user-select:none}
.page{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;
  padding-top:62px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.kicker{font-size:12px;color:var(--faint);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kicker .cat{color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.kicker .why::before{content:"·";margin-right:6px}
.title{font-family:var(--serif);font-weight:400;font-size:clamp(26px, 7.4vw, 34px);line-height:1.12;margin:0;padding-bottom:4px;border-bottom:1px solid var(--rule);text-wrap:balance;overflow-wrap:anywhere}
.from{font-size:13px;color:var(--muted);margin-top:-2px}
.thumb{flex-shrink:0;margin:2px 0 0;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--box);border:1px solid var(--rule);padding:6px}
.pic{position:relative;width:clamp(80px, 23vw, 108px);aspect-ratio:1;max-width:100%;background:var(--bg);border:1px solid var(--rule-soft)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8%;-webkit-user-drag:none}
.pic .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(44px, 13vw, 64px);line-height:1}
.pic.photo{width:100%;height:clamp(130px, 27vh, 240px);aspect-ratio:auto}
.pic.photo img{padding:0}
.pic.noimg::after{content:attr(data-e);position:absolute;inset:0;display:grid;place-items:center;font-size:52px}
.pic.noimg{width:clamp(80px, 23vw, 108px)}
.thumb figcaption{align-self:stretch;min-width:0;display:flex;flex-direction:column;gap:6px;padding:0 2px 1px;font-size:13px;line-height:1.4;color:var(--text);text-align:center}
.sum{font-size:15px;line-height:1.5;margin:2px 0 0;flex:0 1 auto;min-height:0;overflow:hidden;cursor:pointer;padding-right:60px}
.sum p{margin:0 0 .6em}
.sum p:last-child{margin-bottom:0}
.sum.clip{-webkit-mask-image:linear-gradient(#000 calc(100% - 3em), transparent);mask-image:linear-gradient(#000 calc(100% - 3em), transparent)}
.card.reading .thumb{display:none}
.card.reading .sum{overflow-y:auto;overscroll-behavior:contain}
.sum b{font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;flex-shrink:0}
.infobox{border-collapse:collapse;font-size:12.5px;background:var(--bg);border:1px solid var(--rule-soft);width:100%}
.infobox th{width:60%;text-align:left}
.infobox th{font-weight:700;text-align:left;padding:4px 10px;color:var(--text)}
.infobox td{padding:4px 10px 4px 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.read{font-size:14px;text-decoration:none;padding:4px 0;align-self:flex-start;flex-shrink:0}
.read:hover{text-decoration:underline}

/* action rail */
.rail{position:absolute;z-index:3;right:max(8px, env(safe-area-inset-right, 0px));bottom:calc(14px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:12px;align-items:center}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;width:60px;font-size:11px;white-space:nowrap;color:var(--muted)}
.act .disc{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--box);border:1px solid var(--rule-soft);transition:transform .15s}
.act:hover .disc{border-color:var(--rule)}
.act:active .disc{transform:scale(.88)}
.act svg{width:23px;height:23px;fill:none;stroke:var(--text);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.act[aria-pressed="true"].like{color:var(--heart)}
.act[aria-pressed="true"].like svg{fill:var(--heart);stroke:var(--heart)}
.act[aria-pressed="true"].save{color:var(--link)}
.act[aria-pressed="true"].save svg{fill:var(--link);stroke:var(--link)}
.pop svg{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.3)}}

.burst{position:absolute;z-index:6;width:96px;height:96px;margin:-48px 0 0 -48px;pointer-events:none;animation:burst .8s ease-out forwards}
.burst svg{width:100%;height:100%;fill:var(--heart)}
@keyframes burst{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.1);opacity:.95}60%{transform:scale(1);opacity:.95}100%{transform:scale(1.2) translateY(-50px);opacity:0}}

.hint{position:absolute;z-index:4;left:calc(50% - 30px);bottom:calc(16px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);font-size:12px;color:var(--bg);background:var(--text);padding:6px 12px;border-radius:2px;display:flex;align-items:center;gap:6px;animation:nudge 1.6s ease-in-out infinite;white-space:nowrap}
.hint svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
@keyframes nudge{50%{transform:translate(-50%,-5px)}}
.card.reading .read{display:none}

/* end / refill card */
.endcard{justify-content:center}
.end-inner{display:flex;flex-direction:column;gap:12px;max-width:440px;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
.end-inner h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.15;margin:0;padding-bottom:4px;border-bottom:1px solid var(--rule);text-wrap:balance}
.end-inner p{margin:0;color:var(--text);line-height:1.55;font-size:15px}
.btn{align-self:flex-start;padding:9px 14px;border-radius:2px;background:var(--link);color:#fff;font-weight:700;font-size:14px;border:1px solid var(--link)}
.btn.ghost{background:var(--box);color:var(--text);border-color:var(--rule)}
.dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.25}}

/* sheet */
.scrim{position:absolute;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:41;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bg);border-top:1px solid var(--rule);
  transform:translateY(102%);transition:transform .25s ease;
  padding-top:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.sheet.on{transform:none}
.grab{display:none}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:24px 0 10px;padding-bottom:3px;border-bottom:1px solid var(--rule)}
.sheet .lede{font-size:15px;line-height:1.55;margin:0;max-width:62ch}
.stats{display:flex;gap:0;margin-top:14px;border:1px solid var(--rule);background:var(--box);width:max-content;max-width:100%}
.stat{padding:8px 16px;border-right:1px solid var(--rule-soft)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:9px 12px;align-items:center}
.bars .nm{font-size:14px;white-space:nowrap}
.bars .tr{position:relative;height:8px;background:var(--rule-soft)}
.bars .tr::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--rule)}
.bars .fl{position:absolute;top:0;bottom:0}
.bars .v{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.5ch;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:13px;padding:3px 8px;border:1px solid var(--rule);background:var(--box);color:var(--link)}
.empty{color:var(--muted);font-size:14px;margin:0}
.saved{display:flex;flex-direction:column}
.saved a{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule-soft);text-decoration:none;font-size:15px}
.saved a small{font-size:12px;color:var(--muted);align-self:center;white-space:nowrap}
.sheet-foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:16px;max-width:62ch}

.toast{position:absolute;z-index:60;left:50%;top:64px;transform:translate(-50%,-8px);opacity:0;transition:.2s;
  background:var(--text);color:var(--bg);padding:8px 14px;border-radius:2px;font-size:14px;max-width:calc(100% - 32px);text-align:center;pointer-events:none;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-height:700px){.thumb{margin-right:62px}.rail{gap:8px}.act .disc{width:42px;height:42px}}
@media (max-height:620px){.from{display:none}}
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">WikiScroll<sup>[fyp]</sup></div>
    <div class="tools">
    <button class="iconbtn sound" id="soundBtn" aria-pressed="true" aria-label="Music on or off">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
    <div class="langpick">
      <button class="langbtn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Wikipedia language">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.6" ry="8.5"/><path d="M3.5 12h17"/></svg><span id="langCode">EN</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
      </button>
      <div class="langmenu" id="langMenu" role="menu" hidden></div>
    </div>
    <button class="iconbtn" id="openSheet" aria-label="Your likes, saved articles and interests">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
    </div>
  </header>

  <main class="feed" id="feed" aria-label="For You feed"></main>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
    <div class="grab"></div>
    <h2 id="sheetTitle">Your WikiScroll</h2>
    <p class="lede" id="lede"></p>
    <div class="stats" id="stats"></div>
    <h3 id="likedHead">Liked</h3>
    <div class="saved" id="likedList"></div>
    <h3 id="savedHead">Saved</h3>
    <div class="saved" id="savedList"></div>
    <h3 id="musicHead">Music</h3>
    <div class="seg" id="musicSeg" role="group"><button data-m="shop" aria-pressed="false">Cozy shop</button><button data-m="build" aria-pressed="false">Build mode</button><button data-m="off" aria-pressed="false">Off</button></div>
    <h3 id="topicsHead">Topics</h3>
    <div class="bars" id="bars"></div>
    <h3 id="holesHead">Your rabbit holes</h3>
    <div class="tags" id="tags"></div>
    <div class="sheet-foot">
      <button class="btn ghost" id="resetBtn">Reset my feed</button>
      <button class="btn" id="closeSheet">Back to feed</button>
    </div>
    <p class="note" id="note"></p>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(() => {

    offH: "Can’t reach Wikipedia", offP: "Check your connection. The feed will try again in a moment.", retry: "Try again now",

    lede: "Every like, save, share, lingering read and quick swipe nudges these weights. The feed mostly serves what scores highest, and keeps testing new topics so you don’t get stuck in one lane.",

const RAW = [
["space","Voyager 1","nasa deep-space exploration","The farthest human-made object is still phoning home.","Launched by NASA in 1977, Voyager 1 flew past Jupiter and Saturn and simply kept going. In 2012 it became the first spacecraft to cross into interstellar space. Its faint radio signal now needs close to a full day to reach Earth, and it carries a golden record of sounds from our planet.","1977","launch year"],
["space","Olympus Mons","mars volcanoes planets","A volcano so wide you couldn’t see its summit from its edge.","This shield volcano on Mars rises about 22 km above the surrounding plains, roughly two and a half times the height of Everest. Its base covers an area comparable to Poland, and its slopes are so gentle that a person standing on them would barely notice they were climbing.","≈22 km","height above the plains"],
["space","ʻOumuamua","interstellar asteroids mystery","The first visitor we’ve caught arriving from another star.","Spotted by the Pan-STARRS telescope in Hawaii in 2017, ʻOumuamua was the first known object to pass through our Solar System from interstellar space. It was oddly elongated, tumbled as it moved, and sped up slightly in a way gravity alone didn’t explain, which kept astronomers debating what it was.","2017","first sighted"],
["space","Great Red Spot","jupiter planets weather","A storm bigger than Earth that has raged for centuries.","Jupiter’s Great Red Spot is a giant anticyclone wider than our entire planet. It has been watched continuously since at least 1830 and may be the same storm Giovanni Cassini described in 1665. Recent measurements show it is slowly shrinking and becoming rounder.","1830","watched since"],
["space","Kessler syndrome","satellites orbit risk","One collision in orbit could set off a chain reaction.","In 1978 NASA scientist Donald Kessler warned that if enough debris builds up in low Earth orbit, collisions could create fragments that cause more collisions. The cascade could make some orbits too dangerous to use for generations, which is why space agencies now track debris obsessively.","1978","first proposed"],
["space","Boötes Void","cosmology deep-space mystery","A stretch of the universe that is almost completely empty.","The Boötes Void is a vast region of space roughly 330 million light-years across that contains strangely few galaxies, only a few dozen where thousands would be expected. Discovered in 1981, it is one of the largest known voids and a striking example of how lumpy the universe is.","330M","light-years across"],
["space","Laika","space-race animals soviet","A Moscow street dog became the first animal to orbit Earth.","Laika was launched aboard Sputnik 2 in November 1957, just a month after the first Sputnik. The mission proved a living creature could survive launch and weightlessness, but there was no plan to bring her back. Decades later it emerged she died within hours from overheating.","1957","Sputnik 2"],

["nature","Tardigrade","microscopic extremophiles animals","An eight-legged micro-animal that has survived open space.","Tardigrades, or water bears, are about half a millimetre long and live almost everywhere, from mosses to deep-sea sediments. By drying out into a dormant state called a tun, they can endure extreme cold, radiation and near-vacuum. In 2007 some survived direct exposure to space.","0.5 mm","typical length"],
["nature","Turritopsis dohrnii","ocean animals aging","The jellyfish that can run its life cycle backwards.","This tiny jellyfish, about 4.5 mm across, can revert from its adult medusa form back into a juvenile polyp when stressed or injured. In principle it can repeat the cycle again and again, which is why it is often called the immortal jellyfish, although most are eaten or killed by disease.","4.5 mm","across, fully grown"],
["nature","Pando (tree)","plants giants usa","This forest in Utah is actually a single tree.","Pando is a colony of quaking aspen in which roughly 47,000 trunks share one root system and one set of genes. It covers about 43 hectares and is estimated to weigh around 6,000 tonnes, making it one of the heaviest living things on Earth. Grazing deer are slowly thinning it.","6,000 t","estimated mass"],
["nature","Mantis shrimp","ocean animals vision","It punches with the acceleration of a small-calibre bullet.","Mantis shrimp strike prey with club-like limbs so fast the water boils briefly around them, producing a flash and a shockwave. Their eyes are just as unusual, with up to 16 types of photoreceptor compared with our three, and the ability to detect polarised light.","16","types of colour receptor"],
["nature","Octopus","ocean animals intelligence","Three hearts, blue blood and brains in its arms.","Octopuses pump copper-based blue blood with three hearts. About two-thirds of their neurons sit in their arms, which can taste and act semi-independently. They solve puzzles, open jars, change colour and texture in an instant, and some species carry coconut shells to use as shelters.","3","hearts"],
["nature","Mycorrhizal network","fungi plants forests","Fungal threads link the roots of an entire forest.","Underground fungi wrap around or enter plant roots and trade minerals and water for sugars. Their threads can connect many plants at once. The idea of a ‘wood wide web’ took off after a 1997 study, though how much trees deliberately share through it is still debated.","1997","‘wood wide web’ coined"],
["nature","Axolotl","amphibians regeneration mexico","A salamander that never grows up and can regrow its limbs.","The axolotl stays in its aquatic, gilled juvenile form for life, a trait called neoteny. It can regenerate lost limbs, parts of its heart and even brain tissue. Common in labs and aquariums, it is nearly gone in the wild, surviving mainly in the canals of Xochimilco near Mexico City.","CR","IUCN: critically endangered"],

["history","Great Emu War","australia military absurd","Australia sent soldiers with machine guns against emus. The emus won.","In 1932, farmers in Western Australia asked for help against some 20,000 emus eating their wheat. Soldiers armed with Lewis guns were dispatched, but the birds scattered, ran fast and absorbed bullets. After weeks of poor results, the operation was quietly called off.","1932","Western Australia"],
["history","Dancing plague of 1518","mass-hysteria europe medieval","Hundreds of people danced for days and couldn’t stop.","In July 1518 a woman began dancing in a street in Strasbourg and kept going for days. Within weeks dozens, possibly hundreds, had joined her. Authorities even hired musicians, thinking more dancing would cure it. Historians suspect mass psychogenic illness brought on by famine and stress.","1518","Strasbourg"],
["history","Library of Alexandria","ancient books egypt","The ancient world’s great library didn’t burn in a single fire.","Founded in Ptolemaic Egypt in the 3rd century BC, the library aimed to collect every book in the known world and attracted scholars from across the Mediterranean. Popular stories blame one catastrophic blaze, but historians think it faded slowly through budget cuts, purges and neglect.","300 BC","founded, around"],
["history","Antikythera mechanism","ancient greece technology","A 2,000-year-old computer pulled from a shipwreck.","Sponge divers recovered corroded bronze fragments from a Roman-era wreck off a Greek island in 1901. Imaging later revealed dozens of interlocking gears that modelled the motions of the Sun and Moon, predicted eclipses and tracked the Olympic Games. Nothing as complex is known for over a thousand years after.","1901","recovered"],
["history","Tunguska event","russia space disasters","Something exploded over Siberia and flattened 80 million trees.","On the morning of 30 June 1908, a huge blast over a remote part of Siberia knocked down trees across about 2,150 square kilometres. No crater was found. The leading explanation is a stony asteroid or comet fragment that burst apart several kilometres above the ground.","80M","trees flattened"],
["history","Year Without a Summer","volcanoes climate literature","A volcano’s eruption led to snow in June and gave us Frankenstein.","After Mount Tambora in Indonesia erupted in 1815, ash and sulphur in the atmosphere cooled the planet. In 1816 crops failed across Europe and North America. Stuck indoors by storms at Lake Geneva that summer, Mary Shelley began writing Frankenstein.","1816","summer that wasn’t"],
["history","Great Molasses Flood","usa disasters absurd","A wave of molasses swept through Boston at deadly speed.","In January 1919 a giant storage tank in Boston’s North End burst, releasing millions of litres of molasses. A sticky wave several metres high rushed through the streets, crushing buildings and trapping people. Twenty-one died. Locals claimed the area smelled sweet for decades.","1919","Boston’s North End"],

["science","Schrödinger's cat","physics quantum thought-experiments","A cat that is both alive and dead, to make a point.","In 1935 Erwin Schrödinger imagined a cat sealed in a box with a device triggered by a random atomic decay. He meant it as a critique: taken literally, quantum rules would leave the cat both alive and dead until someone looked. It became the best-known image of quantum weirdness.","1935","thought experiment"],
["science","Mpemba effect","physics water mystery","Can hot water freeze faster than cold?","Tanzanian student Erasto Mpemba noticed that his hot ice-cream mixture froze before cooler batches, and published the observation with physicist Denis Osborne in 1969. The effect has been reported since Aristotle, yet careful experiments disagree on whether it is real or an artefact of how it’s measured.","1969","published"],
["science","Bose–Einstein condensate","physics quantum cold","A fifth state of matter, made at a whisker above absolute zero.","Satyendra Nath Bose and Albert Einstein predicted in the 1920s that atoms cooled enough would merge into a single quantum state. It took until 1995 for Eric Cornell and Carl Wieman to create one from rubidium atoms, earning a Nobel Prize in 2001.","1995","first created"],
["science","Prince Rupert's drop","materials glass physics","It survives a hammer blow but explodes if you snap its tail.","Drip molten glass into cold water and it forms a tadpole-shaped drop. The bulbous head is so compressed it can withstand a hammer, yet breaking the thin tail releases internal stress and the entire drop bursts into powder. The Royal Society studied them in the 1660s.","1660s","studied by the Royal Society"],
["science","Pykrete","materials wwii ice","The plan to build an aircraft carrier out of ice and sawdust.","Mixing about 14 percent sawdust into water before freezing creates pykrete, which is far stronger than ice and melts slowly. During the Second World War, inventor Geoffrey Pyke proposed using it for a giant floating airbase called Project Habakkuk. A prototype was built in Canada before the idea was dropped.","14%","sawdust by weight"],
["science","Large Hadron Collider","physics particles europe","A 27-kilometre ring where protons collide near light speed.","Buried beneath the French–Swiss border at CERN, the LHC is the world’s largest particle accelerator. Superconducting magnets steer protons around the ring in opposite directions until they smash together. In 2012 experiments there confirmed the Higgs boson.","27 km","circumference"],
["science","Periodic table","chemistry history-of-science","Mendeleev left gaps for elements nobody had found yet.","When Dmitri Mendeleev arranged the known elements in 1869, he left empty spaces and predicted the properties of what should fill them. Gallium and germanium were discovered over the next two decades with properties strikingly close to his forecasts.","1869","Mendeleev’s table"],

["body","Phantom limb","brain perception medicine","Feeling an arm or leg that is no longer there.","Most people who lose a limb continue to sense it, sometimes as itching or pain. The brain’s map of the body doesn’t vanish with the limb. Neuroscientist V. S. Ramachandran showed that a simple mirror box, which tricks the eye into seeing the missing limb, can ease the pain for some.","60–80%","of amputees feel it"],
["body","Henrietta Lacks","medicine ethics cells","Her cells are still alive and dividing, decades after her death.","In 1951 doctors at Johns Hopkins took tumour cells from Henrietta Lacks without her knowledge. They became HeLa, the first human cell line to keep dividing in the lab, and helped develop the polio vaccine and countless studies. Her story reshaped debates on consent in research.","1951","HeLa cells taken"],
["body","Synesthesia","brain perception senses","For some people, letters have colours and music has shapes.","In synesthesia, stimulating one sense triggers another automatically. Seeing letters or numbers in specific colours is the most common type, but some people taste words or see sounds. The pairings stay consistent over a lifetime, and it seems to run in families.","~4%","of people, by some estimates"],
["body","Hiccup","reflexes records absurd","One man hiccupped for 68 years straight.","A hiccup is an involuntary spasm of the diaphragm followed by the vocal cords snapping shut, producing the ‘hic’. Most bouts pass in minutes, but Charles Osborne from Iowa hiccupped from 1922 to 1990, earning a world record. Why we have the reflex at all is still unclear.","68 yrs","longest bout"],
["body","Gut microbiota","microbes digestion biology","You carry roughly as many bacterial cells as human ones.","Trillions of microbes live in the human gut, helping digest food, produce vitamins and train the immune system. The old claim of ten microbial cells per human cell was revised in 2016 to a ratio closer to one to one, which is still a lot of passengers.","≈1:1","bacteria to human cells"],
["body","Capgras delusion","brain psychology perception","The belief that someone you love has been replaced by an impostor.","People with Capgras delusion recognise a familiar face but feel no emotional connection to it, and conclude the person must be a double. French psychiatrist Joseph Capgras described it in 1923. It can follow brain injury, dementia or psychiatric illness.","1923","first described"],
["body","Dunbar's number","brain social psychology","Your brain may cap you at about 150 real friendships.","Anthropologist Robin Dunbar linked primate brain size to group size and estimated that humans can maintain around 150 stable relationships. Similar numbers show up in villages, army units and company departments, though critics argue the limit is far looser.","150","stable relationships"],

["art","Vincenzo Peruggia","art crime france","The theft that made the Mona Lisa famous.","In August 1911 Vincenzo Peruggia, a handyman who had worked at the Louvre, hid overnight and walked out with the Mona Lisa under his smock. It was missing for over two years. The worldwide headlines turned a respected painting into the most famous artwork on Earth.","1911","stolen from the Louvre"],
["art","4′33″","music avant-garde silence","A famous piece of music in which nobody plays a note.","John Cage’s 1952 composition instructs performers not to play for its three movements. The ‘music’ is whatever the audience hears: coughs, rain, creaking seats. Cage wanted listeners to notice that there is no such thing as true silence.","1952","premiere"],
["art","Voynich manuscript","books mystery codes","A 600-year-old book no one can read.","This illustrated codex is written in an unknown script and filled with drawings of unidentified plants, star charts and bathing figures. Carbon dating places its vellum in the early 15th century. Cryptographers, linguists and AI models have all tried to decode it without agreement.","1404–38","vellum carbon-dated"],
["art","Ecce Homo (García Martínez)","art viral spain","A botched restoration that saved a small town’s economy.","In 2012 an elderly parishioner in Borja, Spain, tried to repair a flaking fresco of Christ. The result went viral as a meme, and tens of thousands of visitors began paying to see it, turning the church into an unlikely tourist attraction.","2012","restoration attempt"],
["art","Kintsugi","japan craft philosophy","Repairing broken pottery with gold instead of hiding the cracks.","Kintsugi mends broken ceramics with lacquer dusted or mixed with powdered gold, silver or platinum. Rather than disguising the damage, it highlights it, treating breakage and repair as part of an object’s history.","金継ぎ","‘golden joinery’"],
["art","Lascaux","prehistory art france","Teenagers following their dog found a cave painted 17,000 years ago.","In 1940 four teenagers in southwestern France squeezed into a hole and found walls covered with horses, aurochs and deer. The paintings are around 17,000 years old. The cave closed to the public in 1963 because visitors’ breath was damaging the art; replicas stand nearby.","≈17,000","years old"],
["art","Stradivarius","music craft italy","Violins made 300 years ago that still sell for millions.","Antonio Stradivari built instruments in Cremona, Italy, in the late 17th and early 18th centuries. Around 650 survive. Players prize their tone, and one violin sold for about 15.9 million dollars in 2011, though blind tests often struggle to tell them from fine modern violins.","≈650","instruments survive"],

["places","Bir Tawil","borders africa terra-nullius","A piece of land that no country wants.","Because of two conflicting border lines drawn in 1899 and 1902, Egypt and Sudan both claim the larger Halaib Triangle and neither claims Bir Tawil, a 2,060 square kilometre patch of desert. It is one of the few places on Earth claimed by no recognised state.","2,060 km²","claimed by no one"],
["places","Point Nemo","ocean extremes space","The loneliest spot in the ocean, where spacecraft go to die.","Point Nemo in the South Pacific is the place farthest from any land, about 2,688 km from the nearest coast. The closest humans are often the astronauts passing overhead. Space agencies steer old satellites and stations to crash here, creating a spacecraft graveyard.","2,688 km","to the nearest land"],
["places","Darvaza gas crater","asia fire accidents","A burning hole in the desert nicknamed the Door to Hell.","In Turkmenistan’s Karakum Desert, a collapsed natural gas field was reportedly set alight by Soviet geologists hoping it would burn off quickly. It has burned ever since, though the exact start date is uncertain. The glowing crater is about 70 metres wide.","1971","burning since, reportedly"],
["places","Baarle-Hertog","borders europe absurd","A town where the border runs through living rooms.","Baarle-Hertog is a Belgian municipality made up of 22 scattered pieces of land inside the Netherlands, some containing Dutch enclaves of their own. Borders cross shops and homes, and a house’s nationality is traditionally set by where its front door sits.","22","Belgian exclaves"],
["places","Mariana Trench","ocean extremes deep-sea","Drop Everest in here and its peak would sit 2 km underwater.","The Mariana Trench in the western Pacific holds the deepest known point in the ocean, Challenger Deep, at close to 11 km down. The pressure there is over a thousand times that at the surface. Only a handful of crewed dives have ever reached the bottom.","≈10,935 m","Challenger Deep"],
["places","Socotra","islands plants asia","An island so isolated it looks like another planet.","Socotra, part of Yemen, split from mainland Africa and Arabia millions of years ago. Around a third of its plant species grow nowhere else, including the umbrella-shaped dragon’s blood tree, whose red resin has been traded since antiquity.","37%","of plants found nowhere else"],
["places","Centralia, Pennsylvania","usa fire ghost-towns","A town emptied by a fire burning underneath it.","In 1962 a fire ignited a coal seam beneath Centralia. It spread through old mine tunnels and has never been put out. Smoke from cracks in the road and dangerous gases led to the relocation of nearly every resident, and the town now has only a few left.","1962","fire still burning"],

["tech","Trojan Room coffee pot","internet computing uk","The first webcam existed to check if the coffee was ready.","In 1991 researchers at the University of Cambridge pointed a camera at a coffee pot so people on other floors could see whether it was full. In 1993 it went onto the World Wide Web, and thousands around the world watched a coffee pot until it was switched off in 2001.","1991","camera switched on"],
["tech","Apollo Guidance Computer","nasa computing space-race","It flew humans to the Moon with about 4 KB of working memory.","The computer aboard Apollo’s command and lunar modules had 2,048 words of erasable memory. Its programs were stored in core rope memory, woven by hand with wires through or around magnetic cores. It was among the first computers to use integrated circuits.","≈4 KB","of RAM"],
["tech","Year 2000 problem","software computing bugs","Two missing digits that cost the world billions.","To save memory, early programmers stored years as two digits, so 2000 would read as 1900. As the millennium approached, governments and companies spent enormous sums fixing old code. Midnight passed with few serious failures, a result often mistaken for proof the danger was exaggerated.","00","the troublesome digits"],
["tech","Velcro","biomimicry invention design","Invented after a walk with a dog covered in burrs.","Swiss engineer George de Mestral came home from a hike in 1941 and studied the burdock burrs stuck to his dog under a microscope. Their tiny hooks inspired a two-sided fastener of hooks and loops. He patented it in 1955, and the name combines velours and crochet.","1955","patented"],
["tech","Enigma machine","wwii cryptography poland","Polish mathematicians cracked Enigma years before Bletchley Park.","Germany used Enigma rotor machines to encrypt military messages. In 1932 Marian Rejewski of the Polish Cipher Bureau worked out its internal wiring using mathematics. Weeks before the war, Poland shared its methods with Britain and France, laying the groundwork for Alan Turing’s team.","1932","first broken"],
["tech","Centennial Light","electricity records usa","A light bulb that has been glowing since 1901.","A hand-blown carbon-filament bulb hangs in a fire station in Livermore, California, and has been almost continuously lit since 1901. It glows at just a few watts. A webcam watches it, and it famously outlived its first webcam.","1901","switched on"],
["tech","QWERTY","design typewriters keyboards","Why your keyboard isn’t in alphabetical order.","The QWERTY layout comes from Christopher Latham Sholes’s typewriter, sold to Remington in 1873. A popular story says it was designed to slow typists and prevent jams, but historians suggest it evolved from telegraph operators’ needs. Better layouts exist; habit keeps this one on top.","1873","sold to Remington"],

["language","Buffalo buffalo Buffalo buffalo buffalo buffalo Buffalo buffalo","grammar puzzles english","A grammatical English sentence made of one word, eight times.","‘Buffalo’ can be a city, an animal and a verb meaning to bully. Arranged correctly, eight in a row form a valid sentence: bison from Buffalo, whom other Buffalo bison bully, also bully Buffalo bison. Linguist William Rapaport popularised it in 1972.","8×","‘buffalo’"],
["language","Silbo Gomero","communication spain whistling","A language whistled across the valleys of a Canary Island.","Residents of La Gomera developed a way to whistle Spanish, turning vowels and consonants into changes of pitch that carry across deep ravines. It nearly died out before being taught in schools. UNESCO recognised it as intangible cultural heritage in 2009.","2009","UNESCO recognition"],
["language","Toki Pona","conlangs minimalism words","A whole language built from about 130 words.","Linguist Sonja Lang created Toki Pona in 2001 to focus on simple, positive thinking. With a tiny vocabulary, speakers combine words to express complex ideas, so a friend might be a ‘good person’. It has a devoted online community and even its own hieroglyph-like script.","≈130","core words"],
["language","Rongorongo","scripts mystery pacific","The undeciphered script of Easter Island.","Rongorongo glyphs are carved on wooden tablets and objects from Rapa Nui. Only about two dozen pieces survive, scattered across museums. No one can read them, and scholars still debate whether they are true writing, and whether they were invented before or after contact with Europeans.","≈26","surviving objects"],
["language","Mondegreen","words music misheard","The word for a misheard lyric comes from a misheard lyric.","Writer Sylvia Wright coined the term in 1954. As a child she heard an old Scottish ballad line, ‘laid him on the green’, as ‘Lady Mondegreen’, imagining a tragic noblewoman who never existed. Now any misheard phrase can be called a mondegreen.","1954","term coined"],
["language","Esperanto","conlangs europe","A language invented to make everyone equal speakers.","Ophthalmologist L. L. Zamenhof, who grew up in multilingual Białystok, published Esperanto in 1887. He hoped a neutral, easy second language would reduce conflict. Its grammar has no irregular verbs, and it remains the most widely spoken constructed language.","1887","first published"],
["language","Dord","dictionaries errors words","A word that existed only because of a typo.","The 1934 edition of Webster’s dictionary defined ‘dord’ as a term for density. In fact, a note reading ‘D or d’, meaning an abbreviation, had been misread as a word. The ghost entry went unnoticed for five years and wasn’t removed until 1947.","dord","‘density’, supposedly"],

["odd","Ship of Theseus","philosophy paradoxes identity","If you replace every plank, is it still the same ship?","Plutarch told of the ship of the hero Theseus, kept in Athens, whose rotten planks were replaced one by one. Philosophers asked whether it remained the same ship, and Thomas Hobbes later added a twist: what if someone rebuilt a second ship from the old planks?","1st c.","told by Plutarch"],
["odd","Toynbee tiles","mystery usa street-art","Cryptic messages about resurrecting the dead on Jupiter, embedded in roads.","Since the 1980s, hundreds of linoleum tiles have appeared pressed into asphalt in US and South American cities. Most carry a variation of the same message, linking historian Arnold Toynbee, the film 2001 and the dead revived on Jupiter. Their creator has never been confirmed.","1980s","first sightings"],
["odd","Bloop","ocean mystery sound","An unexplained ocean sound louder than any whale.","In 1997 underwater microphones operated by NOAA picked up an ultra-low-frequency sound that was detected over thousands of kilometres. Speculation ran wild about giant creatures. Scientists later concluded it matched icequakes, the sound of icebergs cracking.","1997","recorded"],
["odd","Gävle goat","sweden traditions absurd","A giant straw goat that people keep setting on fire.","Every year since 1966, the Swedish town of Gävle has built a huge straw Yule goat for Christmas. It was burned down on its very first year and has been destroyed many more times since, despite guards, fireproofing and webcams.","1966","first goat built"],
["odd","Phineas Gage","brain medicine history","An iron rod went through his skull. He walked away.","In 1848 an explosion drove a metre-long tamping iron through railway foreman Phineas Gage’s head. He survived and could talk soon after, but friends said he was ‘no longer Gage’. His case became a classic in the study of how the brain shapes personality.","1848","the accident"],
["odd","Infinite monkey theorem","probability math thought-experiments","Given infinite time, a monkey will type Shakespeare.","The theorem says that a random typist hitting keys forever will almost surely produce any text, including the complete works of Shakespeare. French mathematician Émile Borel used the image in 1913. In practice the odds are so tiny the universe would end first.","∞","keystrokes needed"],
["odd","Mike the Headless Chicken","animals absurd usa","A chicken that lived for 18 months without a head.","In 1945 a farmer in Fruita, Colorado, beheaded a chicken for dinner, but the axe missed the jugular and most of the brain stem. Mike kept walking and was fed through an eyedropper, touring as a sideshow. The town now holds an annual festival in his honour.","18 mo","lived headless"]

const EXTRA = {"Voyager 1": "Its twin, Voyager 2, launched a few weeks earlier on a slower route. In 1990 Voyager 1 turned its camera back to take the Pale Blue Dot photo, showing Earth as a speck from about 6 billion kilometres away. Its plutonium power supply is fading, so engineers keep switching instruments off to stretch its life.", "Olympus Mons": "It is the tallest known volcano in the Solar System. Mars has no moving tectonic plates, so a hotspot kept feeding lava to the same place for hundreds of millions of years, letting the volcano grow far bigger than anything on Earth. Its summit holds collapsed craters roughly 80 km across, and cliffs several kilometres high ring its base.", "ʻOumuamua": "Its Hawaiian name roughly means a scout or messenger from afar arriving first. It was already leaving when it was found, so telescopes had only weeks to study it. Explanations range from a shard of nitrogen ice to a fragment of a broken-up comet. A few scientists even floated an alien light sail, an idea most astronomers reject.", "Great Red Spot": "Winds around its edge reach over 400 km per hour. Its reddish colour likely comes from chemicals broken apart by sunlight, though the exact recipe is unknown. In the late 1800s it was about 40,000 km wide, roughly three Earths; today it is closer to 1.3 Earth diameters, and scientists are watching to see whether it will eventually fade.", "Kessler syndrome": "Even a fleck of paint at orbital speed can chip a spacecraft window. Real collisions have already happened: in 2009 a dead Russian satellite smashed into an active Iridium satellite, and anti-satellite missile tests have scattered thousands more fragments. The International Space Station regularly fires its engines to dodge debris.", "Boötes Void": "Voids form because matter in the early universe was not spread perfectly evenly. Denser patches pulled in more material, leaving emptier regions to grow emptier. Astronomers think the Boötes Void may be several smaller voids that merged. Most of the universe’s volume is made of voids like this, with galaxies strung along filaments around them.", "Laika": "She was a stray picked from the streets of Moscow, partly because strays were thought to cope better with cold and hunger. Her flight was rushed to coincide with the anniversary of the Russian Revolution. A monument in Moscow honours her, and her mission helped prepare the way for Yuri Gagarin’s flight in 1961.", "Tardigrade": "More than 1,300 species are known. They turn up on mountaintops, in Antarctic moss and in hot springs, though they are active only when surrounded by a film of water. In the tun state their metabolism drops to almost nothing, and some have revived after decades frozen. A protein called Dsup appears to shield their DNA from radiation.", "Turritopsis dohrnii": "When this jellyfish is damaged or starving, it sinks, its body shrinks into a blob, and its cells change into new types, a process called transdifferentiation. The result is a fresh polyp colony genetically identical to the original. Originally from the Mediterranean, it has spread around the world, probably carried in ships’ ballast water.", "Pando (tree)": "Each trunk lives roughly a century, but the root system is far older; estimates of the colony’s age range from several thousand years to much more. Pando spreads mainly by sending up new shoots from its roots rather than by seed. Researchers worry because few young shoots survive grazing deer and cattle, so old trunks aren’t being replaced.", "Mantis shrimp": "Despite the name, they are neither mantises nor true shrimp but stomatopods, a separate group of crustaceans. Some are ‘smashers’ that crack snail shells, others ‘spearers’ that impale fish, and large ones can break aquarium glass. Studies suggest their many photoreceptors help them recognise colours quickly rather than tell more shades apart.", "Octopus": "Two of the hearts push blood through the gills and the third pumps it around the body. Skin cells called chromatophores let them flash new patterns in a fraction of a second. Octopuses have escaped tanks, unscrewed jar lids from the inside and recognised individual keepers. Most species live only a year or two and die soon after breeding.", "Mycorrhizal network": "These partnerships are ancient and appear in fossils of some of the earliest land plants, and most plant species still rely on them today. Ecologist Suzanne Simard’s research suggested carbon can move between trees through fungal links, inspiring talk of ‘mother trees’. Other scientists argue the evidence for deliberate sharing is weaker than often portrayed.", "Axolotl": "Its name comes from Nahuatl and is often linked to Xolotl, an Aztec god. In captivity axolotls come in pale pink, gold and dark varieties and are popular pets. Scientists study how they rebuild complex tissue without scarring, hoping to learn lessons for human medicine. In the wild they are threatened by pollution, urban growth and introduced fish.", "Great Emu War": "The emus were moving inland after breeding when they found newly cleared farmland with water and crops. The officer in charge, Major Meredith, reported that the birds split into small groups and were almost impossible to pin down. Newspapers mocked the campaign, and later the government relied on bounty schemes, which killed far more emus.", "Dancing plague of 1518": "City records and doctors’ notes describe dancers collapsing from exhaustion, and some later accounts claim deaths, though the numbers are uncertain. The episode ended when the afflicted were taken to a shrine of Saint Vitus. Similar outbreaks of compulsive dancing were reported in parts of Europe between the 14th and 17th centuries.", "Library of Alexandria": "It was part of a larger research institution called the Mouseion. Ships docking in Alexandria were reportedly searched for books, which were copied for the collection. Scholars there estimated the Earth’s circumference and edited Homer. Julius Caesar’s fire in 48 BC may have damaged part of it, but the library seems to have survived, diminished, for centuries.", "Antikythera mechanism": "It was housed in a wooden case about the size of a shoebox and turned with a hand crank. Inscriptions on it work like a user manual. Since the 2000s, X-ray scans have revealed hidden gears and text, showing it could even model the Moon’s changing speed across the sky. Who built it remains unknown.", "Tunguska event": "The blast is estimated at several megatons of TNT or more, hundreds of times larger than the Hiroshima bomb. People about 60 km away were knocked off their feet and felt intense heat. The region was so remote that the first scientific expedition, led by Leonid Kulik, arrived only in 1927. Today 30 June is marked as Asteroid Day.", "Year Without a Summer": "Snow fell in New England in June, and frosts struck all summer. Harvests failed in Ireland, Switzerland and parts of China, causing famine and unrest. The same stormy summer at the Villa Diodati also produced John Polidori’s The Vampyre. Some historians link the vivid sunsets in paintings of those years to volcanic haze.", "Great Molasses Flood": "The tank was about 15 metres tall and had leaked from the start; locals collected the syrup that seeped out. The wave is estimated to have moved at over 50 km per hour. Rescuers waded through waist-deep molasses that thickened in the winter cold. A long court case found the owners responsible and led to stricter building rules.", "Schrödinger's cat": "The setup ties the fate of something big and everyday to a quantum event that, on its own, can be in a mix of states. Schrödinger developed the idea in letters with Albert Einstein, who shared his doubts. Physicists still use the cat to explain decoherence and rival interpretations, such as many-worlds, where both outcomes happen in separate branches.", "Mpemba effect": "Suggested explanations include evaporation reducing the hot water’s mass, dissolved gases, convection currents and differences in supercooling. A 2016 study argued that carefully controlled experiments show no clear effect at all. The puzzle is popular enough that the Royal Society of Chemistry ran a competition in 2012 inviting the public to explain it.", "Bose–Einstein condensate": "In a condensate, atoms lose their individual identities and behave like one big wave, so quantum effects become visible on a scale large enough to photograph. The temperatures involved are billionths of a degree above absolute zero. Researchers have used condensates to slow light to around 17 metres per second and to build extremely sensitive sensors.", "Prince Rupert's drop": "The outer surface cools and hardens first, then the inside shrinks as it cools, squeezing the surface into strong compression. When the tail breaks, a crack races through the drop at more than a kilometre per second. High-speed cameras have captured the process in detail. The same principle makes tempered glass, used in car windows, so tough.", "Pykrete": "Pyke reasoned that ice was free and plentiful in the North Atlantic, where steel was scarce. Lord Mountbatten reportedly demonstrated pykrete to Allied leaders by firing a pistol at it, and the bullet bounced off. The planned ship would have been around 600 metres long. Rising costs and longer-range aircraft made it unnecessary.", "Large Hadron Collider": "It first circulated beams in 2008, but a faulty electrical connection caused a magnet accident days later, delaying full operation by over a year. Its magnets are cooled with liquid helium to 1.9 degrees above absolute zero, colder than outer space. Thousands of scientists from more than 100 countries work on its experiments.", "Periodic table": "He arranged elements by atomic weight and chemical behaviour, sometimes swapping pairs when their properties demanded it. Later work showed the real ordering principle is atomic number, the count of protons. Today the table has 118 confirmed elements, the heaviest existing only for fractions of a second in labs. Element 101 is named mendelevium in his honour.", "Phantom limb": "The French military surgeon Ambroise Paré described it in the 16th century. One theory is that brain areas that once received signals from the limb get taken over by neighbouring areas, so touching the face can be felt in a missing hand. Treatments now include mirror therapy, virtual reality and prosthetics that send sensation back to the brain.", "Henrietta Lacks": "She was a 31-year-old African American mother of five being treated for cervical cancer, and she died months later. Her family didn’t learn how her cells were being used for over 20 years. Rebecca Skloot’s 2010 book The Immortal Life of Henrietta Lacks brought her story to millions, and in 2023 her family settled a lawsuit with a company that profited from HeLa.", "Synesthesia": "Many synesthetes don’t realise their experience is unusual until they mention it to someone else. Brain imaging shows extra activity in areas that handle the ‘added’ sense. Several artists and composers have described synesthetic experiences, such as linking musical keys to colours. Scientists think it may come from extra connections between brain regions.", "Hiccup": "The diaphragm’s sudden contraction pulls in air, and the closing glottis stops it, making the sound. Common triggers include eating too fast, fizzy drinks and sudden excitement. Babies hiccup even in the womb, which has led to theories that the reflex helps train breathing muscles. Hiccups lasting more than 48 hours are considered persistent and checked by doctors.", "Gut microbiota": "The community includes hundreds of species, mostly bacteria, plus viruses, fungi and archaea, and it is shaped by diet, birth method, antibiotics and age. Gut microbes break down fibre our own enzymes cannot handle. Researchers are exploring links to obesity, allergies and mood, and faecal transplants already treat a stubborn infection called C. difficile.", "Capgras delusion": "Researchers think it happens when the brain’s face-recognition system still works but its link to emotional response is damaged, so a face looks right but feels wrong. Some people extend the belief to pets, homes or even their own reflection. A related condition, the Fregoli delusion, is the belief that different people are one person in disguise.", "Dunbar's number": "He proposed layers within that circle: about five intimate friends, 15 close friends, 50 good friends and 150 meaningful contacts, each roughly three times larger than the last. He argued that language and gossip evolved partly to maintain these bonds. A 2021 re-analysis of the primate data concluded the uncertainty was too wide to fix any single number.", "Vincenzo Peruggia": "Peruggia kept the painting in a trunk in his Paris lodging for over two years while police questioned others, including the poet Guillaume Apollinaire and, briefly, Pablo Picasso. He was caught in Florence trying to sell it to an art dealer, claiming he wanted to return it to Italy. Many Italians saw him as a patriot, and he served a short sentence.", "4′33″": "The title is the total length of the first performance, given by pianist David Tudor, who closed and opened the piano lid to mark the three movements. Cage was influenced by Zen Buddhism and by a visit to an anechoic chamber, where he still heard the sounds of his own body. He considered it his most important work.", "Voynich manuscript": "It is named after Wilfrid Voynich, a book dealer who bought it in 1912. Statistical studies show its text follows patterns similar to real languages, which makes a meaningless hoax harder to explain. Proposed solutions include a lost language, a cipher, shorthand and an elaborate fake. It is held at Yale’s Beinecke Library and can be viewed online.", "Ecce Homo (García Martínez)": "The original painting by Elías García Martínez dated from around 1930 and showed Christ crowned with thorns. The amateur restorer, Cecilia Giménez, said she had the priest’s permission and was interrupted before finishing. The result was nicknamed ‘Ecce Mono’, Spanish for ‘Behold the Monkey’, and later inspired a comic opera.", "Kintsugi": "The technique is often traced to 15th-century Japan. One story says a shogun sent a cracked tea bowl to China for repair and disliked the ugly metal staples, prompting Japanese craftsmen to find a more beautiful method. It is linked with wabi-sabi, an outlook that finds beauty in imperfection, age and impermanence.", "Lascaux": "The cave holds around 600 painted animals and some 1,500 engravings, including a famous scene of a wounded bison and a man with a bird-like head. Artists used mineral pigments and may have blown paint through hollow tubes. After it opened to visitors in 1948, their breath and the microbes they carried led to fungus and algae on the walls.", "Stradivarius": "Stradivari made violins, violas, cellos, guitars and harps over a career of about 70 years. Theories about their sound include dense wood grown during a cold period in Europe, chemical treatment of the wood and his varnish. Many instruments carry nicknames, like the ‘Messiah’, and some are loaned to leading soloists by foundations.", "Bir Tawil": "The 1899 line followed a straight line of latitude, while the 1902 administrative line assigned land based on the people who used it. Claiming Bir Tawil would mean accepting the line that gives up the Halaib Triangle, which is larger and has a coastline. Several people have planted flags declaring their own kingdoms there; none are recognised.", "Point Nemo": "Its name means ‘no one’ in Latin and nods to Captain Nemo from Jules Verne’s novel. Survey engineer Hrvoje Lukatela pinpointed it in 1992 using computer modelling. More than 250 spacecraft, including the Russian space station Mir, have been deliberately sunk in the surrounding waters, and the ISS is planned to end its life there too.", "Darvaza gas crater": "The crater sits near the village of Darvaza, whose name means ‘gate’ in Persian. Visitors camp near its rim at night, when the flames glow brightest. In 2010 and again in 2022 Turkmenistan’s leadership called for the fire to be put out, citing health and economic reasons, and officials have since reported that the flames have weakened.", "Baarle-Hertog": "The patchwork dates back to medieval treaties and land deals between local lords. White crosses on the pavement mark where the border runs. Some owners have moved their front doors to change their home’s country, for example to fall under different rules. During the COVID-19 pandemic, a few shops had to close the half that sat in Belgium.", "Mariana Trench": "In 1960 Jacques Piccard and Don Walsh reached the bottom in the bathyscaphe Trieste. Film director James Cameron made the first solo dive in 2012, and explorer Victor Vescovo completed repeated dives from 2019. Animals live even at these depths, including amphipods and snailfish, and plastic bags have been spotted on the seafloor.", "Socotra": "The archipelago has been cut off from the mainland for millions of years. Its dragon’s blood trees grow in an umbrella shape that catches moisture from mist and shades their roots. Socotra became a UNESCO World Heritage Site in 2008. Its unusual plants and animals face pressure from goats, climate change and political turmoil in Yemen.", "Centralia, Pennsylvania": "The most common account says it began when burning rubbish at the town dump spread into an exposed coal seam. In 1981 a 12-year-old boy fell into a sinkhole that suddenly opened in his grandmother’s backyard and was pulled out by his cousin. Congress funded relocation in the 1980s, and the town later lost its postal code.", "Trojan Room coffee pot": "The pot stood in the Trojan Room of the old Computer Laboratory. The first version used a frame grabber and a small program called XCoffee, which showed a tiny greyscale image updated a few times a minute. When the pot was retired, it sold on eBay for about £3,350 to the news website Spiegel Online.", "Apollo Guidance Computer": "Astronauts used a keypad called the DSKY, entering two-digit ‘verb’ and ‘noun’ codes to give commands. During the Apollo 11 landing it flashed 1202 and 1201 alarms because it was overloaded, but its software was designed to drop low-priority tasks and keep going. Margaret Hamilton led the team that built the onboard flight software.", "Year 2000 problem": "Estimates of worldwide spending on fixes run into hundreds of billions of dollars, as banks, power grids, airlines and governments tested systems for years. A few minor glitches did occur, such as wrong dates on websites. A similar problem looms in 2038, when many systems that count seconds since 1970 will run out of room.", "Velcro": "Early versions used cotton, which wore out quickly, so de Mestral switched to nylon, which could be shaped into tough hooks. The product was slow to catch on until NASA used it to keep objects from floating around in spacecraft. Velcro is a brand name; the generic term is hook-and-loop fastener.", "Enigma machine": "Each keypress turned the rotors, so the same letter encrypted differently every time, and the Germans changed the settings daily, giving an astronomical number of combinations. The Poles built machines called bombas to speed up the search. At Bletchley Park, Turing and Gordon Welchman designed the bombe, and the resulting intelligence, called Ultra, is credited with shortening the war.", "Centennial Light": "It was made by the Shelby Electric Company in Ohio in the late 1890s. Its long life is often credited to being left on almost constantly at very low power, which limits wear on the filament. It has been moved only a few times, including in 1976, when it was off for about 22 minutes. Fans threw a party for its 100th birthday in 2001.", "QWERTY": "Its name comes from the first six letters on the top row. Rival designs include the Dvorak layout, patented in 1936, which puts the most common letters on the home row. Countries adapted it for their languages, giving QWERTZ in Germany and Central Europe and AZERTY in France and Belgium. Phones then copied it onto touchscreens.", "Buffalo buffalo Buffalo buffalo buffalo buffalo Buffalo buffalo": "It works because English lets nouns act as adjectives, allows relative clauses that drop ‘whom’ or ‘that’, and has a verb spelled like the noun. Readers stumble because the brain grabs the most common meaning first, a classic garden-path sentence. Chinese has a famous cousin: a poem written entirely with the syllable ‘shi’.", "Silbo Gomero": "Whistlers use their fingers in the mouth to shape and amplify the sound, which can carry several kilometres across the island’s steep terrain. It uses only a few whistled vowels and consonants, so context helps listeners decode messages. It descends from a whistled language of the island’s original inhabitants and has been taught in local schools since 1999.", "Toki Pona": "Its name means roughly ‘good language’ or ‘simple language’. Words have broad meanings: ‘telo’ covers water and other liquids, and ‘suli’ can mean big, long or important. Lang published an official book in 2014 and a dictionary in 2021. In 2022 the language received an ISO 639-3 code, a sign of how many people now use it.", "Rongorongo": "The glyphs show stylised animals, people and plants. Lines run in a pattern called reverse boustrophedon, so readers rotate the tablet 180 degrees at the end of each line. Most tablets were lost or destroyed during the upheavals of the 1860s, when slave raids and disease devastated the island’s population. One tablet appears to contain a lunar calendar.", "Mondegreen": "Children are especially prone to them as they try to make sense of words they haven’t heard before, so prayers and anthems are classic sources. A close relative is the eggcorn, a misheard phrase that still makes some sense, like ‘old-timers’ disease’ for Alzheimer’s. Researchers study them to learn how the brain predicts speech from fragments.", "Esperanto": "Zamenhof published under the pen name Doktoro Esperanto, meaning ‘Doctor Hopeful’, which became the language’s name. Its vocabulary draws mostly on Romance and Germanic languages, and endings show grammar: nouns end in -o and adjectives in -a. Speaker estimates vary widely, and a small number of people have grown up speaking it from birth.", "Dord": "The slip came from a card meant for the abbreviations section, marked ‘D or d, cont./density’. An editor spotted the problem in 1939 when he noticed the word had no etymology. Ghost words often come from misprints or misread handwriting. Some reference books even plant deliberate fake entries to catch copycats; these are called mountweazels.", "Ship of Theseus": "The puzzle touches everyday questions: our bodies replace many cells over time, bands change every member, and companies swap all their staff. Philosophers answer it differently, focusing on continuous history, original material or function. A homely variation is ‘grandfather’s axe’, which has had a new head and a new handle but is still called his.", "Toynbee tiles": "The usual text links Toynbee’s idea, the film 2001 and resurrecting the dead on Jupiter. The tiles are thought to be laid on roads wrapped in tar paper, so passing cars press them into the asphalt. A 2011 documentary, Resurrect Dead, investigated a Philadelphia man as the likely creator. Newer tiles with different messages suggest copycats.", "Bloop": "It was picked up by hydrophones from a system originally built by the US Navy to track submarines. The sound rose quickly in frequency and lasted about a minute. It came from a remote area of the South Pacific. The Bloop became famous online partly because the location is near the fictional sunken city in an H. P. Lovecraft story.", "Gävle goat": "The goat stands about 13 metres tall and is put up in the town’s Castle Square at the start of Advent. It has been destroyed in more than half of its years, and bookmakers take bets on its fate. One famous fire came in 2001, when an American tourist set it alight, saying he thought burning it was a legal tradition.", "Phineas Gage": "The iron entered under his left cheekbone and left through the top of his skull, destroying much of his left frontal lobe. His doctor, John Harlow, documented his recovery and reported changes in his behaviour. Gage later drove stagecoaches in Chile, which suggests he regained much social function. His skull is displayed at Harvard.", "Infinite monkey theorem": "The idea shows how unlimited tries can make the seemingly impossible certain, and how vast the real numbers are: even a single line of Shakespeare would take a random typist far longer than the age of the universe. In 2003 researchers left a computer in a macaque enclosure at a Devon zoo; the monkeys mostly typed the letter S.", "Mike the Headless Chicken": "His owner, Lloyd Olsen, took him on tour, and he appeared in Time and Life magazines. Scientists at the University of Utah examined him: the axe had left enough brain stem to run basic functions, and a blood clot stopped him from bleeding to death. He died in 1947 after choking in a motel room."};

const PROPS = {
  prop: "extracts|pageimages|description|pageprops|info",
  exintro: 1, explaintext: 1, exlimit: "max",
  piprop: "thumbnail", pithumbsize: 640,
  ppprop: "disambiguation", redirects: 1
};
async function wq(params, lang) {
  const u = new URL("https://" + (lang || LANG) + ".wikipedia.org/w/api.php");
  const all = Object.assign({ action: "query", format: "json", formatversion: 2, origin: "*" }, params);
  for (const k in all) u.searchParams.set(k, all[k]);
  const r = await fetch(u, { headers: { "Api-User-Agent": "WikiScroll/1.0 (https://wikiscroll.site)" } });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (j.error && !params.gsrsort) throw new Error(j.error.code || "api");
  return j;
}

function tagsFrom(desc) {
  const w = String(desc || "").toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, " ").split(/\s+/)
    .filter(x => x.length > 2 && !STOP.has(x) && !/^\d+(s)?$/.test(x));
  return [...new Set(w)].slice(0, 4);
}
function paragraphs(text) {
  const out = []; let len = 0;
  for (const p of String(text).split(/\n+/).map(s => s.trim()).filter(s => s && !/^=+/.test(s))) {
    if (len > 1600) break;
    out.push(p); len += p.length;
  }
  return out;
}
function toLive(data, cat, via, opt) {
  const pages = (data && data.query && data.query.pages) || [];
  return pages.filter(p =>
      !p.missing && p.ns === 0 && p.extract && p.extract.length >= 300 &&
      !(p.pageprops && "disambiguation" in p.pageprops) &&
      !/^(List|Index|Outline|Timeline) of /.test(p.title) &&
      (p.length || 0) >= opt.minLen && (!opt.needImg || p.thumbnail))
    .map(p => ({
      id: lp() + "w" + p.pageid, title: p.title, cat, desc: p.description || "",
      tags: tagsFrom(p.description), paras: paragraphs(p.extract),
      img: p.thumbnail ? p.thumbnail.source : "", kind: p.thumbnail ? "photo" : "none",
      fv: "", fl: "", via, live: true
    }));
}

// Polish and Spanish: pick articles with English Wikipedia's topic search and quality signals,
// then follow the interlanguage link to the local article. Local featured/good articles are the fallback.
const FEATURED = { pl: "incategory:Artykuły_na_medal|Dobre_artykuły", es: "incategory:Wikipedia:Artículos_destacados|Wikipedia:Artículos_buenos", de: "incategory:Wikipedia:Exzellent|Wikipedia:Lesenswert" };
async function viaEnglish(enParams, cat, via, opt) {
  const base = { prop: "langlinks|info", lllang: LANG, lllimit: "max" };
  let d = await wq(Object.assign({}, base, enParams), "en");
  if (d.error && enParams.gsrsort) {
    const p = Object.assign({}, enParams); delete p.gsrsort; p.gsroffset = Math.floor(Math.random() * 300);
    d = await wq(Object.assign({}, base, p), "en");
  }
  const titles = ((d.query && d.query.pages) || [])
    .filter(p => p.langlinks && p.langlinks.length && (p.length || 0) >= (opt.enMin || 0))
    .map(p => p.langlinks[0].title || p.langlinks[0]["*"])
    .filter(x => x && !seenT.has(tkey(x)));
  if (!titles.length) return [];
  const d2 = await wq(Object.assign({}, PROPS, { titles: shuffle(titles).slice(0, 20).join("|") }));
  return toLive(d2, cat, via, opt);
}

  if (!FEATURED[LANG]) {

    return toLive(r, cat, { k: "topic" }, { minLen: 4000, needImg: true });
  }
  const q = { generator: "search", gsrsearch: FEATURED[LANG], gsrlimit: 20, gsrnamespace: 0 };
  let d;
  try { d = await wq(Object.assign({}, PROPS, q, { gsrsort: "random" })); if (d.error) throw 0; }
  catch { d = await wq(Object.assign({}, PROPS, q, { gsroffset: Math.floor(Math.random() * 400) })); }
  return toLive(d, cat, { k: "topic" }, { minLen: 6000, needImg: false });
}
